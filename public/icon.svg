<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Navigation Pointer Gradient -->
    <linearGradient id="navGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="navGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Transfusion Blood Drop Gradient -->
    <linearGradient id="bloodGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ef4444" flood-opacity="0.45"/>
    </filter>
    <filter id="navGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Full Icon Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>

  <!-- Compass / Radar Circular Grids -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="#475569" stroke-width="2" opacity="0.3"/>

  <!-- Cardinal Compass Tick Marks -->
  <line x1="256" y1="26" x2="256" y2="48" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="464" x2="256" y2="486" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="26" y1="256" x2="48" y2="256" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <line x1="464" y1="256" x2="486" y2="256" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- 45-degree sub-ticks -->
  <line x1="93" y1="93" x2="108" y2="108" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="419" y1="93" x2="404" y2="108" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="93" y1="419" x2="108" y2="404" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="419" y1="419" x2="404" y2="404" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Navigation Compass Arrow Wings (Behind Blood Drop) -->
  <g filter="url(#navGlow)">
    <!-- Upward Navigation Arrow Left Wing -->
    <path d="M256 64 L120 380 L256 316 Z" fill="url(#navGradLeft)"/>
    <!-- Upward Navigation Arrow Right Wing -->
    <path d="M256 64 L256 316 L392 380 Z" fill="url(#navGradRight)"/>
    <!-- Inner Arrow Highlights -->
    <path d="M256 80 L140 366 L256 312 Z" fill="#ffffff" opacity="0.12"/>
  </g>

  <!-- Central Transfusion Blood Droplet -->
  <g filter="url(#glow)">
    <!-- Droplet Body -->
    <path d="M256 160 C256 160 352 272 352 344 C352 397 309 440 256 440 C203 440 160 397 160 344 C160 272 256 160 256 160 Z"
          fill="url(#bloodGrad)"
          stroke="#fca5a5"
          stroke-width="3.5"/>

    <!-- Droplet Glossy Reflection Curve -->
    <path d="M208 300 C194 330 196 368 214 394"
          fill="none"
          stroke="#ffffff"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.5"/>
    <circle cx="216" cy="276" r="6" fill="#ffffff" opacity="0.6"/>

    <!-- Medical Transfusion Cross inside Droplet -->
    <g fill="#ffffff">
      <!-- Vertical bar -->
      <rect x="244" y="308" width="24" height="68" rx="6" />
      <!-- Horizontal bar -->
      <rect x="222" y="330" width="68" height="24" rx="6" />
    </g>
  </g>

  <!-- Top North Indicator Pip -->
  <polygon points="256,18 266,38 246,38" fill="#38bdf8"/>
</svg>
